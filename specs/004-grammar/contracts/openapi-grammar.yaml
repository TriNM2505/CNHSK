openapi: 3.1.0
info:
  title: CNHSK Grammar API
  version: 1.0.0
  description: >
    Hợp đồng spec 004-grammar. Trả lời/kết thúc bài tập dùng bộ máy lượt luyện spec 003
    (/api/practice/sessions/{id}/answers, /finish). Chỉ LEARNER.
servers:
  - url: http://localhost:8080
tags:
  - name: grammar
security:
  - cookieAuth: []
  - bearerAuth: []

components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: access_token }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    GrammarId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    ErrorResponse:
      $ref: '../../003-vocab-topics/contracts/openapi-practice-vocab.yaml#/components/schemas/ErrorResponse'
    SessionView:
      $ref: '../../003-vocab-topics/contracts/openapi-practice-vocab.yaml#/components/schemas/SessionView'
    FinishResult:
      $ref: '../../003-vocab-topics/contracts/openapi-practice-vocab.yaml#/components/schemas/FinishResult'
    GrammarSummary:
      type: object
      required: [id, text, titleVi, hskLevel, exerciseCount, learned]
      properties:
        id: { type: integer, format: int64 }
        text: { type: string, example: 是……的 }
        titleVi: { type: string }
        hskLevel: { type: integer, minimum: 1, maximum: 9 }
        structure: { type: [string, 'null'] }
        exerciseCount: { type: integer }
        learned: { type: boolean }
        bestPercent: { type: [integer, 'null'] }
        lastStudiedAt: { type: [string, 'null'], format: date-time }
    GrammarLesson:
      allOf:
        - $ref: '#/components/schemas/GrammarSummary'
        - type: object
          required: [explanation, examples]
          properties:
            explanation: { type: string }
            commonMistake: { type: [string, 'null'] }
            examples:
              type: array
              items:
                type: object
                required: [cn, vi]
                properties:
                  cn: { type: string }
                  pinyin: { type: [string, 'null'] }
                  vi: { type: string }
    GrammarLessonExtra:
      type: object
      description: FinishResult.extra của nguồn GRAMMAR_LESSON
      properties:
        exercisesTotal: { type: integer }
        answered: { type: integer }
        correct: { type: integer }
        percent: { type: [integer, 'null'] }
        skippedExercises: { type: boolean }
        firstTimeLearned: { type: boolean }
  responses:
    Error:
      description: Lỗi theo spec 004 §5
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

paths:
  /api/grammar:
    get:
      tags: [grammar]
      operationId: listGrammarPoints
      summary: Danh sách điểm ngữ pháp (FR-001…FR-003)
      parameters:
        - name: hskLevel
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 3
            items: { type: integer, minimum: 1, maximum: 9 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GrammarSummary' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/grammar/{id}:
    get:
      tags: [grammar]
      operationId: getGrammarLesson
      summary: Nội dung bài học, không kèm bài tập (FR-005)
      parameters: [ { $ref: '#/components/parameters/GrammarId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrammarLesson' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/grammar/{id}/lessons:
    post:
      tags: [grammar]
      operationId: startGrammarLesson
      summary: Bấm "Đã hiểu" — tạo lượt bài tập (FR-009…FR-014)
      parameters: [ { $ref: '#/components/parameters/GrammarId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [readDurationMs]
              properties:
                readDurationMs: { type: integer, minimum: 0, maximum: 3600000 }
      responses:
        '200':
          description: Tiếp tục lượt đang làm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        '201':
          description: Lượt mới; khi không có bài tập thì kèm finish (lượt đã kết thúc)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionView'
                  - type: object
                    required: [session, finish]
                    properties:
                      session: { $ref: '#/components/schemas/SessionView' }
                      finish: { $ref: '#/components/schemas/FinishResult' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
