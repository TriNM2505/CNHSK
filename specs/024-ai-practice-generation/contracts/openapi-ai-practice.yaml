openapi: 3.1.0
info:
  title: CNHSK AI Practice Generation — admin API
  version: 1.0.0
  description: >
    Hợp đồng spec 024. /api/admin/ai-questions/** cần TEACHER hoặc CONTENT_EDITOR;
    /api/admin/ai-generation-runs/** cần ADMIN. Xem/sửa từng câu dùng /api/admin/questions/{id} của spec 010.
    Request đổi trạng thái qua cookie cần X-XSRF-TOKEN. Người học không có endpoint mới.

security:
  - cookieAuth: []
  - bearerAuth: []

components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: access_token }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: false
      schema: { type: string }
  schemas:
    ErrorResponse:
      type: object
      required: [error_code, message, request_id]
      properties:
        error_code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    Label:
      type: object
      required: [kid, role]
      properties:
        kid: { type: string }
        role: { type: string, enum: [PRIMARY, SECONDARY] }
    AiQuestionSummary:
      type: object
      required: [id, stemSummary, hskLevel, labels, generatedAt, runId, viewedByMe]
      properties:
        id: { type: integer, format: int64 }
        stemSummary: { type: string, maxLength: 80 }
        hskLevel: { type: integer }
        labels: { type: array, items: { $ref: '#/components/schemas/Label' } }
        generatedAt: { type: string, format: date-time }
        runId: { type: [integer, 'null'], format: int64 }
        viewedByMe: { type: boolean }
    AiQuestionPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AiQuestionSummary' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    ReviewResult:
      type: object
      required: [id, status, reviewedAt]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [APPROVED, REJECTED] }
        reviewedAt: { type: string, format: date-time }
    RejectBody:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    BulkApproveBody:
      type: object
      required: [ids]
      properties:
        ids: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { type: integer, format: int64 } }
    BulkResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [id, outcome]
            properties:
              id: { type: integer, format: int64 }
              outcome: { type: string, enum: [APPROVED, NOT_VIEWED, NOT_PENDING, MALFORMED] }
    Run:
      type: object
      required: [id, kid, status, createdAt, completedAt, questionCount, droppedCount, inputTokens, outputTokens, error]
      properties:
        id: { type: integer, format: int64 }
        kid: { type: string }
        status: { type: string, enum: [RUNNING, COMPLETED, FAILED] }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        questionCount: { type: integer }
        droppedCount: { type: integer }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        error: { type: [string, 'null'], enum: [INVALID_OUTPUT, BUDGET_EXCEEDED, PROVIDER_ERROR, NO_VALID_QUESTION, STALE, null] }
    RunPage:
      type: object
      required: [enabled, monthTokens, items, page, size, totalElements]
      properties:
        enabled: { type: boolean }
        monthTokens: { type: integer, format: int64 }
        items: { type: array, items: { $ref: '#/components/schemas/Run' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    TriggerResult:
      type: object
      required: [started]
      properties:
        started: { type: boolean }
  responses:
    Error:
      description: Lỗi theo spec 024 §5
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

paths:
  /api/admin/ai-questions:
    get:
      tags: [ai-review]
      operationId: listAiQuestions
      summary: Câu AI chờ duyệt (FR-011)
      parameters:
        - name: kid
          in: query
          schema: { type: string, maxLength: 20 }
        - name: hsk
          in: query
          schema: { type: integer, minimum: 1, maximum: 9 }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/AiQuestionPage' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/admin/ai-questions/{id}/approve:
    post:
      tags: [ai-review]
      operationId: approveAiQuestion
      summary: Duyệt một câu (FR-014)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: APPROVED
          content: { application/json: { schema: { $ref: '#/components/schemas/ReviewResult' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/admin/ai-questions/{id}/reject:
    post:
      tags: [ai-review]
      operationId: rejectAiQuestion
      summary: Từ chối có lý do (FR-015)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RejectBody' } } }
      responses:
        '200':
          description: REJECTED
          content: { application/json: { schema: { $ref: '#/components/schemas/ReviewResult' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/admin/ai-questions/bulk-approve:
    post:
      tags: [ai-review]
      operationId: bulkApproveAiQuestions
      summary: Duyệt hàng loạt câu đã xem (FR-016)
      parameters: [{ $ref: '#/components/parameters/XsrfToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BulkApproveBody' } } }
      responses:
        '200':
          description: Kết quả từng câu
          content: { application/json: { schema: { $ref: '#/components/schemas/BulkResult' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/admin/ai-generation-runs:
    get:
      tags: [ai-runs]
      operationId: listAiGenerationRuns
      summary: Lịch sử lô + token (FR-018)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [RUNNING, COMPLETED, FAILED] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/RunPage' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/admin/ai-generation-runs/trigger:
    post:
      tags: [ai-runs]
      operationId: triggerAiGeneration
      summary: Chạy thử một lần, bất đồng bộ (FR-019)
      parameters: [{ $ref: '#/components/parameters/XsrfToken' }]
      responses:
        '202':
          description: Đã bắt đầu
          content: { application/json: { schema: { $ref: '#/components/schemas/TriggerResult' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
