openapi: 3.1.0
info:
  title: CNHSK AI Practice Generation — admin API
  version: 1.1.0
  description: >
    Additive T-05 appendix to openapi-ai-practice.yaml, FR-011 through FR-016.
    Review has two steps on the same PENDING_REVIEW row (spec 024 v1.6). Step TEACHER:
    a TEACHER checks the content; approve records reviewed_by and returns TEACHER_APPROVED,
    the row stays PENDING_REVIEW and learners do not see it. Step CONTENT: a CONTENT_EDITOR
    other than that teacher approves (APPROVED, learners see it) or rejects. Each caller
    lists and acts on only the steps its roles allow; the wrong step returns 403, and in
    bulk approve it is reported as NOT_PENDING. ADMIN alone is forbidden (403). Request mutations authenticated by cookie require X-XSRF-TOKEN.
    Original 010 and 024 contracts remain unchanged. Existing 010 GET detail adds
    an actor-specific Redis viewed marker only for AI PENDING_REVIEW questions,
    expiring after 24 hours; marker failure does not fail the detail response.
    Existing 010 PUT stays TEACHER only; CONTENT_EDITOR gets 403 before parsing the
    body, including for AI PENDING_REVIEW. TEACHER keeps all 010 parameters, fields,
    statuses, validation and audit rules. An edited pending AI multiple-choice or true/false question
    stores the sole correct option key so it remains eligible for FR-014 approval.
  x-original-contract: ./openapi-ai-practice.yaml
  x-existing-operations:
    - method: GET
      path: /api/admin/questions/{id}
      contract: ../../010-knowledge-tree/contracts/openapi-knowledge.yaml
      operationId: getQuestion
      change: FR-012 actor-specific viewed marker; request and response unchanged.
    - method: PUT
      path: /api/admin/questions/{id}
      contract: ../../010-knowledge-tree/contracts/openapi-knowledge.yaml
      operationId: updateQuestion
      change: FR-013 scoped editor permission and pending AI correct_key preservation.
security:
  - cookieAuth: []
  - bearerAuth: []

components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: access_token }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: false
      schema: { type: string }
  schemas:
    ErrorResponse:
      type: object
      required: [error_code, message, request_id]
      properties:
        error_code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    Label:
      type: object
      required: [kid, role]
      properties:
        kid: { type: string }
        role: { type: string, enum: [PRIMARY, SECONDARY] }
    AiQuestionSummary:
      type: object
      required: [id, stemSummary, qtype, hskLevel, labels, generatedAt, runId, viewedByMe, step]
      properties:
        id: { type: integer, format: int64 }
        stemSummary: { type: string, maxLength: 80 }
        qtype: { type: string, enum: [MULTIPLE_CHOICE, TRUE_FALSE] }
        hskLevel: { type: integer }
        labels: { type: array, items: { $ref: '#/components/schemas/Label' } }
        generatedAt: { type: string, format: date-time }
        runId: { type: [integer, 'null'], format: int64 }
        viewedByMe: { type: boolean }
        step: { type: string, enum: [TEACHER, CONTENT] }
    AiQuestionPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AiQuestionSummary' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    ReviewResult:
      type: object
      required: [id, status, reviewedAt]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [TEACHER_APPROVED, APPROVED, REJECTED] }
        reviewedAt: { type: string, format: date-time }
    RejectBody:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    BulkApproveBody:
      type: object
      required: [ids]
      properties:
        ids: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { type: integer, format: int64, minimum: 1 } }
    BulkResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [id, outcome]
            properties:
              id: { type: integer, format: int64 }
              outcome: { type: string, enum: [TEACHER_APPROVED, APPROVED, NOT_VIEWED, NOT_PENDING, MALFORMED] }
  responses:
    Error:
      description: Lỗi theo spec 024 §5
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

paths:
  /api/admin/ai-questions:
    get:
      tags: [ai-review]
      operationId: listAiQuestions
      summary: Câu AI chờ duyệt (FR-011)
      parameters:
        - name: kid
          in: query
          schema: { type: string, maxLength: 20 }
        - name: hsk
          in: query
          schema: { type: integer, minimum: 1, maximum: 9 }
        - name: qtype
          in: query
          schema: { type: string, enum: [MULTIPLE_CHOICE, TRUE_FALSE] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/AiQuestionPage' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/admin/ai-questions/{id}/approve:
    post:
      tags: [ai-review]
      operationId: approveAiQuestion
      summary: Duyệt một câu (FR-014)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: APPROVED
          content: { application/json: { schema: { $ref: '#/components/schemas/ReviewResult' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/admin/ai-questions/{id}/reject:
    post:
      tags: [ai-review]
      operationId: rejectAiQuestion
      summary: Từ chối có lý do (FR-015)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RejectBody' } } }
      responses:
        '200':
          description: REJECTED
          content: { application/json: { schema: { $ref: '#/components/schemas/ReviewResult' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/admin/ai-questions/bulk-approve:
    post:
      tags: [ai-review]
      operationId: bulkApproveAiQuestions
      summary: Duyệt hàng loạt câu đã xem (FR-016)
      description: >
        IDs must be positive, unique int64 values. Results preserve request order.
        Each eligible ID and its audit record commit in a separate transaction.
        A viewed ID whose question is missing produces NOT_PENDING; an unavailable or missing actor
        viewed marker produces NOT_VIEWED, except that a CONTENT_EDITOR needs no marker for a question a
        teacher already checked; an ID waiting for another role's step produces NOT_PENDING.
        TEACHER_APPROVED marks a finished teacher step, APPROVED a finished content step.
        An unexpected database or audit failure rolls back that ID and stops the
        request with INTERNAL_ERROR (500), preserving earlier committed IDs.
        Retrying sees those committed IDs as NOT_PENDING. No FAILED outcome is added.
      parameters: [{ $ref: '#/components/parameters/XsrfToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BulkApproveBody' } } }
      responses:
        '200':
          description: Kết quả từng câu
          content: { application/json: { schema: { $ref: '#/components/schemas/BulkResult' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error', description: 'INTERNAL_ERROR; failing ID rolled back, earlier commits retained' }
