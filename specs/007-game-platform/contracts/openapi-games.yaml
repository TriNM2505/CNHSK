openapi: 3.1.0
info:
  title: CNHSK Game Platform API
  version: 1.0.0
  description: >
    Hợp đồng spec 007. Server chấm từng lượt; KHÔNG endpoint nào nhận điểm từ client.
    Body có trường lạ (score, points…) bị từ chối 422. Gọi từ game.cnhsk.com bằng cookie (credentials: include)
    hoặc Authorization: Bearer (WebView).
servers:
  - url: http://localhost:8080
tags:
  - name: games
security:
  - cookieAuth: []
  - bearerAuth: []

components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: access_token }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    RoundId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    ErrorResponse:
      $ref: '../../003-vocab-topics/contracts/openapi-practice-vocab.yaml#/components/schemas/ErrorResponse'
    ServedItemView:
      $ref: '../../003-vocab-topics/contracts/openapi-practice-vocab.yaml#/components/schemas/ServedItemView'
    GameCode:
      type: string
      enum: [CHAR_RAIN, PINYIN_MATCH, RADICAL_MATCH, CHAR_CATCH]
    GameInfo:
      type: object
      required: [code, name, description, skill, howToPlay, timeLimitSeconds, playable]
      properties:
        code: { $ref: '#/components/schemas/GameCode' }
        name: { type: string, example: Mưa chữ }
        description: { type: string }
        skill: { type: string, example: CHARACTER }
        howToPlay: { type: string }
        timeLimitSeconds: { type: integer }
        playable: { type: boolean }
        unavailableReason: { type: [string, 'null'], enum: [NOT_ENOUGH_CONTENT, null] }
        myStats:
          oneOf:
            - type: 'null'
            - type: object
              required: [bestPoints, roundsPlayed]
              properties:
                bestPoints: { type: integer, format: int64 }
                roundsPlayed: { type: integer }
                lastPlayedAt: { type: [string, 'null'], format: date-time }
    RoundStart:
      type: object
      required: [roundId, gameCode, serverTime, startedAt, timeLimitSeconds, deadline, pointsPerCorrect, uiConfig, items]
      properties:
        roundId: { type: integer, format: int64 }
        gameCode: { $ref: '#/components/schemas/GameCode' }
        serverTime: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        timeLimitSeconds: { type: integer }
        deadline: { type: string, format: date-time }
        pointsPerCorrect: { type: integer }
        uiConfig: { type: object, additionalProperties: true }
        items: { type: array, items: { $ref: '#/components/schemas/ServedItemView' } }
    RoundView:
      allOf:
        - $ref: '#/components/schemas/RoundStart'
        - type: object
          required: [status, answered]
          properties:
            status: { type: string, enum: [IN_PROGRESS, SUBMITTED, ABANDONED, EXPIRED] }
            answered:
              type: array
              items:
                type: object
                properties:
                  no: { type: integer }
                  correct: { type: [boolean, 'null'] }
                  correctAnswer: { type: [string, 'null'] }
            totalPoints: { type: integer, format: int64 }
    RoundAnswerRequest:
      type: object
      additionalProperties: false
      required: [no, answer, durationMs]
      properties:
        no: { type: integer, minimum: 1 }
        answer: { type: string, maxLength: 100 }
        durationMs: { type: integer, minimum: 0, maximum: 600000 }
    RoundAnswerResult:
      type: object
      required: [no, correct, correctAnswer, pointsAwarded, totalPoints, answeredCount]
      properties:
        no: { type: integer }
        correct: { type: boolean }
        correctAnswer: { type: string }
        pointsAwarded: { type: integer }
        totalPoints: { type: integer, format: int64 }
        answeredCount: { type: integer }
    RoundResult:
      type: object
      required: [roundId, points, maxPoints, correct, wrong, missed, durationMs, skill, bestPoints, newBest, suspicious]
      properties:
        roundId: { type: integer, format: int64 }
        points: { type: integer, format: int64 }
        maxPoints: { type: integer, format: int64 }
        correct: { type: integer }
        wrong: { type: integer }
        missed: { type: integer }
        accuracy: { type: [integer, 'null'] }
        durationMs: { type: integer }
        skill: { type: string }
        bestPoints: { type: integer, format: int64 }
        newBest: { type: boolean }
        suspicious: { type: boolean }
  responses:
    Error:
      description: Lỗi theo spec 007 §5
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

paths:
  /api/community/games:
    get:
      tags: [games]
      operationId: listGames
      summary: Danh mục 4 game, công khai; thành tích khi đăng nhập (FR-002…FR-005)
      security: [ {}, { cookieAuth: [] }, { bearerAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GameInfo' } }

  /api/community/games/{code}/rounds:
    post:
      tags: [games]
      operationId: startRound
      summary: Tạo ván do server cấp (FR-006…FR-011)
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                hskLevel: { type: integer, minimum: 1, maximum: 9 }
      responses:
        '201':
          description: Ván mới, không có đáp án
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoundStart' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/community/games/rounds/{id}:
    get:
      tags: [games]
      operationId: getRound
      summary: Khôi phục ván khi tải lại trang
      parameters: [ { $ref: '#/components/parameters/RoundId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoundView' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/community/games/rounds/{id}/answers:
    post:
      tags: [games]
      operationId: answerRound
      summary: Trả lời một lượt, chấm ở server (FR-012…FR-014)
      parameters: [ { $ref: '#/components/parameters/RoundId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoundAnswerRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoundAnswerResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/community/games/rounds/{id}/finish:
    post:
      tags: [games]
      operationId: finishRound
      summary: Kết thúc ván, server tính điểm (FR-015…FR-018)
      parameters: [ { $ref: '#/components/parameters/RoundId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoundResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/community/games/rounds/{id}/abandon:
    post:
      tags: [games]
      operationId: abandonRound
      summary: Thoát ván, không điểm (FR-019)
      parameters: [ { $ref: '#/components/parameters/RoundId' } ]
      responses:
        '204': { description: Đã bỏ }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
