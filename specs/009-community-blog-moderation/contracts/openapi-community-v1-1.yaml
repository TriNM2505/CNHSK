openapi: 3.1.0
info:
  title: CNHSK Community — phụ lục v1.1 (hồ sơ, theo dõi, báo cáo bộ thẻ)
  version: 1.1.0
  description: >
    Hợp đồng phụ lục spec 009 §16. Tách khỏi openapi-community.yaml vì CommunityContractTest khoá file gốc
    (24 operation, so hai chiều với /v3/api-docs). Task cài đặt (tasks.md T-24) gộp phần này vào file gốc
    và nâng số operation trong test cùng một PR. Lỗi dùng ErrorResponse của file gốc.
    Thay đổi trên operation có sẵn: GET /api/public/community/posts thêm query authorId (FR-066);
    POST /api/community/reports nhận targetType COLLECTION (FR-073); ReportCaseDetail.target thêm ReportedDeck (FR-074).

security:
  - cookieAuth: []
  - bearerAuth: []

components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: access_token }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    AuthorId:
      name: authorId
      in: query
      description: Chỉ bài APPROVED của tác giả này (FR-066) — thêm vào GET /api/public/community/posts
      schema: { type: integer, format: int64, minimum: 1 }
  schemas:
    ErrorResponse:
      type: object
      required: [error_code, message, request_id]
      properties:
        error_code: { type: string }
        message: { type: string }
        request_id: { type: string }
    ReportTargetType:
      type: string
      description: v1.1 thêm COLLECTION (bộ thẻ công khai, FR-073)
      enum: [POST, COMMENT, COLLECTION]
    ReportedDeck:
      type: object
      description: target của ReportCaseDetail khi targetType = COLLECTION (FR-074)
      required: [id, name, description, isPublic, cardCount, author, cards]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: [string, 'null'] }
        isPublic: { type: boolean }
        cardCount: { type: integer }
        author:
          type: object
          required: [id, displayName]
          properties:
            id: { type: integer, format: int64 }
            displayName: { type: [string, 'null'] }
        cards:
          type: array
          maxItems: 20
          items:
            type: object
            required: [front, back]
            properties:
              front: { type: string }
              back: { type: string }
    CommunityProfile:
      type: object
      description: Hồ sơ công khai SCR-042 (FR-064) — không có email, role, lý do khoá
      required: [id, displayName, avatarUrl, followerCount, followingCount, approvedPostCount, followedByMe, self]
      properties:
        id: { type: integer, format: int64 }
        displayName: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'] }
        followerCount: { type: integer, format: int64 }
        followingCount: { type: integer, format: int64 }
        approvedPostCount: { type: integer, format: int64 }
        followedByMe: { type: boolean }
        self: { type: boolean }
    FollowState:
      type: object
      required: [following, followerCount]
      properties:
        following: { type: boolean }
        followerCount: { type: integer, format: int64 }
    UserCard:
      type: object
      required: [id, displayName, avatarUrl, followedByMe]
      properties:
        id: { type: integer, format: int64 }
        displayName: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'] }
        followedByMe: { type: boolean }
    UserCardPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/UserCard' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
  responses:
    Error:
      description: Lỗi theo spec 009 §5
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

paths:
  /api/community/users/{id}:
    get:
      tags: [community-users]
      operationId: getCommunityProfile
      summary: Hồ sơ cộng đồng SCR-042 (FR-064, FR-065)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityProfile' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/community/users/{id}/follow:
    post:
      tags: [community-users]
      operationId: followUser
      summary: Theo dõi, idempotent (FR-067, FR-068)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowState' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [community-users]
      operationId: unfollowUser
      summary: Bỏ theo dõi, idempotent (FR-069)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowState' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/community/users/{id}/followers:
    get:
      tags: [community-users]
      operationId: listFollowers
      summary: Người theo dõi (FR-070)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserCardPage' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/community/users/{id}/following:
    get:
      tags: [community-users]
      operationId: listFollowing
      summary: Đang theo dõi (FR-070)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserCardPage' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
