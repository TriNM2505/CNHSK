openapi: 3.1.0
info:
  title: CNHSK Hanzi Recognition and Writing API
  version: 1.0.0
  description: >
    Hợp đồng spec 006. Trả lời nhận diện và nộp thử thách dùng bộ máy spec 003
    (/api/practice/sessions/{id}/answers, /finish). Chỉ LEARNER.
servers:
  - url: http://localhost:8080
tags:
  - name: characters
  - name: writing
security:
  - cookieAuth: []
  - bearerAuth: []

components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: access_token }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    ErrorResponse:
      $ref: '../../003-vocab-topics/contracts/openapi-practice-vocab.yaml#/components/schemas/ErrorResponse'
    SessionView:
      $ref: '../../003-vocab-topics/contracts/openapi-practice-vocab.yaml#/components/schemas/SessionView'
    CharacterSummary:
      type: object
      required: [id, text, meaning, hasAudio]
      properties:
        id: { type: integer, format: int64 }
        text: { type: string, minLength: 1, maxLength: 1 }
        pinyin: { type: [string, 'null'] }
        meaning: { type: string }
        hskLevel: { type: [integer, 'null'] }
        strokeCount: { type: [integer, 'null'] }
        hasAudio: { type: boolean }
    CharacterPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CharacterSummary' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    CharacterDetail:
      allOf:
        - $ref: '#/components/schemas/CharacterSummary'
        - type: object
          required: [writing]
          properties:
            sinoViet: { type: [string, 'null'] }
            radical: { type: [string, 'null'] }
            audioUrl: { type: [string, 'null'] }
            writing:
              type: object
              required: [strokeAvailable, recallUnlocked, dictationAvailable]
              properties:
                strokeAvailable: { type: boolean }
                recallUnlocked: { type: boolean }
                dictationAvailable: { type: boolean }
                lastPracticedAt: { type: [string, 'null'], format: date-time }
    WritingAttemptRequest:
      type: object
      required: [lexemeId, mode, completed, accuracy, strokeMisses, durationMs]
      properties:
        lexemeId: { type: integer, format: int64 }
        mode: { type: string, enum: [STROKE, RECALL, DICTATION] }
        completed: { type: boolean }
        accuracy: { type: number, minimum: 0, maximum: 1 }
        strokeMisses: { type: integer, minimum: 0 }
        durationMs: { type: integer, minimum: 0, maximum: 3600000 }
        usedAnimation: { type: boolean, default: false }
        previewCount: { type: integer, minimum: 0, default: 0 }
        previewMs: { type: integer, minimum: 0, default: 0 }
        replayCount: { type: integer, minimum: 0, default: 0 }
    WritingAttemptResult:
      type: object
      required: [attemptId, recorded, counted, recallUnlocked]
      properties:
        attemptId: { type: integer, format: int64 }
        recorded: { type: boolean, const: true }
        counted: { type: boolean }
        recallUnlocked: { type: boolean }
    WritingChallengeExtra:
      type: object
      description: FinishResult.extra của nguồn WRITING_CHALLENGE
      properties:
        completedChars: { type: integer }
        failedChars: { type: integer }
        incompleteChars: { type: integer }
        total: { type: integer }
        finishedReason: { type: string, enum: [ALL_DONE, TIME_UP, MAX_MISTAKES] }
  responses:
    Error:
      description: Lỗi theo spec 006 §5
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Session:
      description: Lượt
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SessionView' }

paths:
  /api/characters:
    get:
      tags: [characters]
      operationId: listCharacters
      summary: Tra chữ để luyện (FR-001)
      parameters:
        - { name: hskLevel, in: query, schema: { type: integer, minimum: 1, maximum: 9 } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 20 } }
        - { name: page, in: query, description: "page × size SHALL be at most 2147483647.", schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterPage' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/characters/{id}:
    get:
      tags: [characters]
      operationId: getCharacter
      summary: Chi tiết chữ + trạng thái chế độ viết (FR-002, FR-003)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/characters/recognition-sessions:
    post:
      tags: [characters]
      operationId: startRecognition
      summary: Bắt đầu nhận diện chữ (FR-004…FR-008)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, hskLevel]
              properties:
                mode: { type: string, enum: [CHAR_TO_MEANING, AUDIO_TO_CHAR] }
                hskLevel: { type: integer, minimum: 1, maximum: 9 }
                count: { type: integer, minimum: 5, maximum: 20, default: 10 }
      responses:
        '201': { $ref: '#/components/responses/Session' }
        '200':
          description: Không có chữ phù hợp
          content:
            application/json:
              schema:
                type: object
                required: [session, reason]
                properties:
                  session: { type: 'null' }
                  reason: { type: string, const: NO_CHARACTERS }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/writing/attempts:
    post:
      tags: [writing]
      operationId: recordWritingAttempt
      summary: Ghi kết quả viết một chữ (FR-010…FR-019)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WritingAttemptRequest' }
      responses:
        '201':
          description: Đã ghi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WritingAttemptResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/writing/challenges:
    post:
      tags: [writing]
      operationId: startWritingChallenge
      summary: Bắt đầu hoặc tiếp tục thử thách (FR-020…FR-023)
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '201': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
