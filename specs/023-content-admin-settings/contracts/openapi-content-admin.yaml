openapi: 3.1.0
info:
  title: CNHSK Content Admin & System Settings API
  version: 1.0.0
  description: >
    Hợp đồng spec 023. /api/admin/settings/** cần ADMIN; /api/admin/exams/** và /api/admin/topics/** cần CONTENT_EDITOR.
    Request đổi trạng thái qua cookie cần X-XSRF-TOKEN. Thay đổi trạng thái LOCKED/TOPIC_LOCKED của 003 nằm ở
    specs/003-vocab-topics/contracts/openapi-practice-vocab.yaml (task T-07).

security:
  - cookieAuth: []
  - bearerAuth: []

components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: access_token }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Key:
      name: key
      in: path
      required: true
      schema: { type: string, maxLength: 100 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: false
      schema: { type: string }
  schemas:
    ErrorResponse:
      type: object
      required: [error_code, message, request_id]
      properties:
        error_code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    UserRef:
      type: object
      required: [id, displayName]
      properties:
        id: { type: integer, format: int64 }
        displayName: { type: [string, 'null'] }
    SettingItem:
      type: object
      required: [key, group, description, type, currentValue, defaultValue, min, max, overridden, updatedBy, updatedAt]
      properties:
        key: { type: string }
        group: { type: string }
        description: { type: string }
        type: { type: string, enum: [INT] }
        currentValue: { type: integer }
        defaultValue: { type: integer }
        min: { type: integer }
        max: { type: integer }
        overridden: { type: boolean }
        updatedBy:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        updatedAt: { type: [string, 'null'], format: date-time }
    SettingWrite:
      type: object
      required: [value, reason]
      properties:
        value: { type: integer }
        reason: { type: string, minLength: 1, maxLength: 500 }
    SettingReset:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    SettingHistoryEntry:
      type: object
      required: [oldValue, newValue, reason, actor, at]
      properties:
        oldValue: { type: [integer, 'null'] }
        newValue: { type: [integer, 'null'], description: null = về mặc định }
        reason: { type: string }
        actor: { $ref: '#/components/schemas/UserRef' }
        at: { type: string, format: date-time }
    SettingHistoryPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SettingHistoryEntry' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    ExamStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    ExamSection:
      type: object
      required: [name, type, durationMin]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [LISTENING, READING, WRITING] }
        durationMin: { type: integer, minimum: 0, maximum: 180 }
    ExamQuestionWrite:
      type: object
      required: [questionId, sectionIndex, points]
      properties:
        questionId: { type: integer, format: int64 }
        sectionIndex: { type: integer, minimum: 0, maximum: 4 }
        points: { type: integer, minimum: 1, maximum: 100 }
    ExamWrite:
      type: object
      required: [code, title, hskLevel, totalScore, sections, questions]
      properties:
        code: { type: string, pattern: '^[A-Z0-9-]{1,50}$' }
        title: { type: string, minLength: 1, maxLength: 200 }
        hskLevel: { type: integer, minimum: 1, maximum: 6 }
        totalScore: { type: integer, minimum: 1, maximum: 1000 }
        sections: { type: array, minItems: 1, maxItems: 5, items: { $ref: '#/components/schemas/ExamSection' } }
        questions: { type: array, maxItems: 300, items: { $ref: '#/components/schemas/ExamQuestionWrite' } }
    ExamUpdate:
      allOf:
        - $ref: '#/components/schemas/ExamWrite'
        - type: object
          required: [etag]
          properties:
            etag: { type: string }
    EtagBody:
      type: object
      required: [etag]
      properties:
        etag: { type: string }
    CloneBody:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[A-Z0-9-]{1,50}$' }
        title: { type: [string, 'null'], maxLength: 200 }
    ExamQuestionView:
      type: object
      required: [questionId, sectionIndex, orderIndex, points, code, qtype, status, kid, hasAudio]
      properties:
        questionId: { type: integer, format: int64 }
        sectionIndex: { type: integer }
        orderIndex: { type: integer }
        points: { type: integer }
        code: { type: [string, 'null'] }
        qtype: { type: string }
        status: { type: string }
        kid: { type: [string, 'null'] }
        hasAudio: { type: boolean }
    PublicationError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [EMPTY_SECTION, QUESTION_NOT_APPROVED, QUESTION_WITHOUT_KID, QUESTION_UNSUPPORTED, LISTENING_AUDIO_MISSING, SCORE_MISMATCH] }
        message: { type: string }
        sectionIndex: { type: [integer, 'null'] }
        questionId: { type: [integer, 'null'], format: int64 }
    ExamDetail:
      type: object
      required: [id, code, title, hskLevel, totalScore, sections, status, publishedAt, etag, questions, publicationErrors]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        title: { type: string }
        hskLevel: { type: integer }
        totalScore: { type: integer }
        sections: { type: array, items: { $ref: '#/components/schemas/ExamSection' } }
        status: { $ref: '#/components/schemas/ExamStatus' }
        publishedAt: { type: [string, 'null'], format: date-time }
        etag: { type: string }
        questions: { type: array, items: { $ref: '#/components/schemas/ExamQuestionView' } }
        publicationErrors: { type: array, items: { $ref: '#/components/schemas/PublicationError' } }
    AdminExamSummary:
      type: object
      required: [id, code, title, hskLevel, status, publishedAt, questionCount, inUse]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        title: { type: string }
        hskLevel: { type: integer }
        status: { $ref: '#/components/schemas/ExamStatus' }
        publishedAt: { type: [string, 'null'], format: date-time }
        questionCount: { type: integer }
        inUse: { type: boolean }
    AdminExamPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminExamSummary' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    TopicRef:
      type: object
      required: [id, name, hskLevel]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        hskLevel: { type: integer }
    AdminTopic:
      type: object
      required: [id, name, hskLevel, prereqs, isRoot]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        hskLevel: { type: integer }
        prereqs: { type: array, items: { $ref: '#/components/schemas/TopicRef' } }
        isRoot: { type: boolean }
        warnings: { type: array, items: { type: string } }
    AdminTopicPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminTopic' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    PrerequisiteWrite:
      type: object
      required: [prereqIds]
      properties:
        prereqIds: { type: array, maxItems: 10, uniqueItems: true, items: { type: integer, format: int64 } }
  responses:
    Error:
      description: Lỗi theo spec 023 §5
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

paths:
  /api/admin/settings:
    get:
      tags: [settings]
      operationId: listSettings
      summary: Khoá được phép đổi (FR-004)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SettingItem' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/admin/settings/{key}:
    put:
      tags: [settings]
      operationId: updateSetting
      summary: Đổi giá trị trong khoảng (FR-005)
      parameters:
        - $ref: '#/components/parameters/Key'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SettingWrite' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SettingItem' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [settings]
      operationId: resetSetting
      summary: Về mặc định (FR-006)
      parameters:
        - $ref: '#/components/parameters/Key'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SettingReset' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SettingItem' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/admin/settings/{key}/history:
    get:
      tags: [settings]
      operationId: getSettingHistory
      summary: Lịch sử đổi (FR-007)
      parameters:
        - $ref: '#/components/parameters/Key'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SettingHistoryPage' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/admin/exams:
    get:
      tags: [exam-admin]
      operationId: adminListExams
      summary: Danh sách đề (FR-011)
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ExamStatus' }
        - name: hsk
          in: query
          schema: { type: integer, minimum: 1, maximum: 6 }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminExamPage' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [exam-admin]
      operationId: adminCreateExam
      summary: Tạo đề nháp (FR-012)
      parameters: [{ $ref: '#/components/parameters/XsrfToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExamWrite' } } }
      responses:
        '201':
          description: Đã tạo
          content: { application/json: { schema: { $ref: '#/components/schemas/ExamDetail' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/admin/exams/{id}:
    get:
      tags: [exam-admin]
      operationId: adminGetExam
      summary: Chi tiết đề + lỗi chặn công bố (FR-013)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ExamDetail' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [exam-admin]
      operationId: adminUpdateExam
      summary: Sửa đề nháp (FR-014)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExamUpdate' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ExamDetail' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/admin/exams/{id}/publish:
    post:
      tags: [exam-admin]
      operationId: adminPublishExam
      summary: Công bố sau khi kiểm (FR-015)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EtagBody' } } }
      responses:
        '200':
          description: PUBLISHED
          content: { application/json: { schema: { $ref: '#/components/schemas/ExamDetail' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/admin/exams/{id}/archive:
    post:
      tags: [exam-admin]
      operationId: adminArchiveExam
      summary: Lưu trữ (FR-016)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: ARCHIVED
          content: { application/json: { schema: { $ref: '#/components/schemas/ExamDetail' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/admin/exams/{id}/clone:
    post:
      tags: [exam-admin]
      operationId: adminCloneExam
      summary: Nhân bản thành đề nháp (FR-017)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CloneBody' } } }
      responses:
        '201':
          description: Đề nháp mới
          content: { application/json: { schema: { $ref: '#/components/schemas/ExamDetail' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/admin/topics:
    get:
      tags: [topic-admin]
      operationId: adminListTopics
      summary: Chủ đề và tiên quyết (FR-020)
      parameters:
        - name: hsk
          in: query
          schema: { type: integer, minimum: 1, maximum: 9 }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminTopicPage' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/admin/topics/{id}/prerequisites:
    put:
      tags: [topic-admin]
      operationId: adminSetTopicPrerequisites
      summary: Đặt tiên quyết, chặn vòng (FR-021)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PrerequisiteWrite' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminTopic' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
