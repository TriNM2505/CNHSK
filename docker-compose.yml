name: cnhsk-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cnhsk_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 stores PGDATA under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    configs:
      - source: postgres-app-user
        target: /docker-entrypoint-initdb.d/01-app-user.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "cnhsk_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

configs:
  postgres-app-user:
    content: |
      -- Keep the application role separate from the migration owner.
      \getenv app_user DB_USER
      \getenv app_password DB_PASSWORD
      CREATE ROLE :"app_user" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE
        PASSWORD :'app_password';

volumes:
  postgres-data:
