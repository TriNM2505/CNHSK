# Cau hinh cho test: dung H2 trong bo nho, khong can Docker.
# Test nao dung SQL dac thu PostgreSQL thi chay DB that qua Docker.
spring:
  datasource:
    url: jdbc:h2:mem:cnhsk;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS auth\;CREATE SCHEMA IF NOT EXISTS learning\;CREATE SCHEMA IF NOT EXISTS community\;CREATE SCHEMA IF NOT EXISTS shared
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

cnhsk:
  import:
    recover-on-startup: false
    maintenance-cron: "-"
  jwt:
    secret: ${random.uuid}
  practice:
    expire-cron: "-"
