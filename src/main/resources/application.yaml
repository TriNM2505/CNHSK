spring:
  application:
    name: cnhsk-api

  servlet:
    multipart:
      max-file-size: ${cnhsk.import.max-file-size:2MB}
      max-request-size: 3MB
      file-size-threshold: 3MB
      resolve-lazily: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cnhsk_db}
    username: ${DB_USER:svc_app}
    # CANH BAO: dev_app_pwd chi dung cho may cuc bo.
    # Khi deploy that, dat bien moi truong DB_PASSWORD - KHONG sua file nay.
    password: ${DB_PASSWORD:dev_app_pwd}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # KHONG BAO GIO doi thanh update - Flyway quan schema, Hibernate chi kiem tra
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    # Bon schema deu do Flyway quan ly (AC-04). Bang lich su dat o learning.
    schemas: learning,auth,community,shared
    default-schema: learning
    create-schemas: true
    # Flyway chay bang tai khoan owner (tao/sua bang). App chay bang svc_app
    # chi co quyen doc/ghi du lieu (database.md §10). Thieu bien thi dung chung tai khoan app.
    user: ${DB_MIGRATION_USER:${DB_USER:svc_app}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:dev_app_pwd}}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          debug: false
          starttls:
            enable: ${SMTP_STARTTLS:false}
            required: ${SMTP_STARTTLS:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: 8080

# API documentation is opt-in and enabled only by the dev profile.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Mui gio cho moi tac vu dinh ky. Server chay UTC nen bat buoc ghi ro.
app:
  timezone: Asia/Ho_Chi_Minh

cnhsk:
  contest:
    submit-grace-seconds: 5
  quiz:
    question-count: 10
    min-seconds-per-question: 2
    session-minutes: 30
  reminder:
    cron: "0 0 * * * *"
    batch-size: 500
  reference:
    allowed-domains:
      YOUTUBE_CHANNEL: [youtube.com, youtu.be]
      PODCAST: [open.spotify.com, podcasts.apple.com, soundcloud.com, ximalaya.com, podcasts.google.com]
      BOOK: [tiki.vn, shopee.vn, fahasa.com, amazon.com, books.google.com, nxbgd.vn]
    thumbnail-domains: [i.ytimg.com, yt3.ggpht.com, salt.tikicdn.com, m.media-amazon.com]
  billing:
    card-code-pepper: ${CARD_CODE_PEPPER}
    free-monthly-limit: 10
  ai:
    assistant-model: claude-haiku-5-5
    translate-model: claude-haiku-5-5
    timeout: 15s
    monthly-token-budget: 2000000
  assistant:
    daily-limit: 200
  library:
    guest-lookups-per-hour: 60
    authenticated-lookups-per-hour: 600
    max-notes: 1000
    max-decks: 50
    max-cards: 500
    flashcard-reviews-per-hour: 500
  import:
    max-file-size: 2MB
    max-rows: 5000
    preview-ttl: 30m
  placement:
    block-size: 5
    min-items: 25
    max-items: 35
    up-at: 4
    down-at: 2
    thresholds:
      1: 60
      2: 65
      3: 75
    sure-min-items: 10
    start-level: 2
    min-bank-per-level: 10
  mastery:
    seen-item-days: 7
    context-weights:
      EXAM: 1.0
      QUIZ: 0.8
      GRADED: 0.6
      PRACTICE: 0.5
    form-weights:
      OPEN: 1.0
      MCQ4: 0.75
      MCQ3: 0.67
      BINARY: 0.5
    role-weights:
      PRIMARY: 1.0
      SECONDARY: 0.5
      ERROR: 1.0
    inferred-min-confidence: 2.0
    inferred-from: 80
    window: 8
    max-practice-in-window: 3
    min-evidence: 3
    min-distinct-days: 2
    min-confidence: 1.0
    half-life-days: 30
    review-below: 60
    extend-from: 80
    hysteresis: 3
    due-days:
      review: 3
      consolidate: 7
      extend: 14
  grading:
    claim-hours: 48
    grading-hours: 24
    teacher-payout-credits: 0
    min-hanzi: 50
    max-hanzi: 500
    max-chars: 3000
    max-active-claims: 3
    expiry-job-cron: "0 */5 * * * *"
  fsrs:
    weights: [0.40255, 1.18385, 3.173, 15.69105, 7.1949, 0.5345, 1.4604, 0.0046, 1.54575, 0.1192, 1.01925, 1.9395, 0.11, 0.29605, 2.2698, 0.2315, 2.9898, 0.51655, 0.6621]
    desired-retention: 0.9
    min-interval-days: 1
    max-interval-days: 365
    session-max-items: 50
